<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reels UI</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <div class="feed-container">
        <div class="reel-container">

            <div class="reel-media">
                <video src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-lights-41674-large.mp4" autoplay loop muted playsinline></video>
                <div class="video-overlay"></div>
            </div>

            <header class="reel-header">
                <div class="reel head-title">
                    <h2>Reels</h2>
                </div>
                <div class="reel-head-btn-act">
                    <button class="action-btn aria-lable="Camera">
                        <i class="ri-camera-4-line"></i>
                    </button>
                    <button class="act-button" aria-label="Muted">
                        <i class="ri-volume-mute-line"></i>
                    </button>
                </div>
            </header>

            <div class="reel-actions">
                <button class="act-button" aria-label="Like">
                    <i class="ri-heart-line"></i>
                    <span>2452</span>
                </button>
                <button class="act-button" aria-label="Comment">
                    <i class="ri-chat-3-line"></i>
                    <span>1420</span>
                </button>
                <button class="act-button" aria-label="Share">
                    <i class="ri-send-ins-line"></i>
                    <span>2456</span>
                </button>
                <button class="act-button" aria-label="Menu">
                    <i class="ri-more-2-line"></i>
                </button>
                <div class="action-audio-disc">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=60" alt="Audio Thumbnail">
                </div>
            </div>

            <div class="reel-footer">
                <div class="reel-user-info">
                    <div class="user-profile">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=60" alt="User Avatar">
                        <span class="username">sophia_styles</span>
                    </div>
                    <button class="follow">Follow</button>
                </div>
                
                <p class="reel-caption">
                    Neon nights and city lights ✨ Living life in full color! What's your favorite vibe? <span class="hashtag">#neonvibes #citylife #aesthetic</span>
                </p>

                <div class="reel-audio-info">
                    <i class="ri-music-2-fill"></i>
                    <div class="marquee">
                        <span>Original Audio - sophia_styles</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
